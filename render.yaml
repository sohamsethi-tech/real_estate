services:
  - type: web
    name: vgroup-real-estate-demo
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_FIXTURES
        value: "false"
      - key: SEED_FIXTURES
        value: "false"
      - key: EMBEDDED_POSTGRES
        value: "false"
      - key: SESSION_TTL_HOURS
        value: "8"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
